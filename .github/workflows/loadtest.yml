name: Load test

on: [workflow_dispatch]

permissions:
  id-token: write # Require write permission to Fetch an OIDC token.
  contents: read # This is required for actions/checkout

env:
  # For AZURE_WEBAPP_NAME enter just the name, not the full URL.
  RESOURCE_GROUP: az2006-rg
  LOAD_TEST_RESOURCE: az2006loadtest
  AZURE_WEBAPP_NAME: az2006app3736

jobs:
  # This workflow consists of a single job called "loadtest"
  loadtest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Azure Load Testing action
        uses: actions/checkout@v4
        with:
          repository: Azure/load-testing
          ref: 09c53cb9c4bea539ae8634dc76673a36474e250c
          path: .github/actions/azure-load-testing

      - name: Set up Node.js for Azure Load Testing action
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Azure Load Testing action dependencies
        run: npm ci
        working-directory: ./.github/actions/azure-load-testing

      #Login in your azure subscription using OpenID Connect (credentials stored as GitHub secrets in repo)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Run the load test
      - name: Azure Load Testing
        # Use the checked-out action source plus installed dependencies to avoid the broken published package.
        uses: ./.github/actions/azure-load-testing
        with:
          loadTestConfigFile: 'config.yaml'
          loadTestResource: ${{ env.LOAD_TEST_RESOURCE}}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          env: |
            [
              {
                "name": "webapp",
                "value": "${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
              }
            ]

      # upload the published website code artifacts
      - name: Upload artifact for deployment job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadTestResults
          path: ${{github.workspace}}/loadTest
